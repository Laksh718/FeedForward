version: "1"
services:
- type: web
  name: feedforward
  runtime: docker
  repo: https://github.com/Laksh718/FeedForward
  plan: free
  envVars:
  - key: GEMINI_API_KEY
    sync: false
  - key: ADMIN_PIN
    sync: false
  - key: GEMINI_MODEL
    sync: false
