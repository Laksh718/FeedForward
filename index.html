<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="feedforward-mode" content="static">
  <meta name="feedforward-api" content="https://feedforward-195t.onrender.com">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FeedForward</title>
  <meta name="description" content="FeedForward forecasts how much of each dish a mess kitchen should cook, as a range, flags surplus risk before food is wasted, and leaves the final call to the kitchen.">
  <meta name="theme-color" content="#E7F3EC">
  <meta property="og:title" content="FeedForward: predict, prevent, provide">
  <meta property="og:description" content="Dish by dish demand ranges for the next days, rare event plans, surplus risk and a copilot that explains the numbers. Plans are approved by a person, or automatically when the kitchen switches that on.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/service.css">
  <link rel="stylesheet" href="css/desk.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body data-view="landing">
  <a class="skip-link" href="#main">Skip to the content</a>
  <div class="liquid-bg" aria-hidden="true"><i class="lb lb1"></i><i class="lb lb2"></i><i class="lb lb3"></i><i class="lb lb4"></i></div>

  <header class="topbar">
    <a class="brand" href="#landing" aria-label="FeedForward, home"><span class="brand-mark" data-logo></span><span class="brand-word">Feed<b>Forward</b></span></a>
    <nav class="viewbar" aria-label="Choose a view">
      <div class="viewbar-tabs" role="tablist">
        <button role="tab" id="tab-landing" aria-controls="view-landing" data-view-tab="landing" data-icon="home" aria-selected="true"><span class="tab-long">Home</span><span class="tab-short">Home</span></button>
        <button role="tab" id="tab-service" aria-controls="view-service" data-view-tab="service" data-icon="service" aria-selected="false"><span class="tab-long">Service board</span><span class="tab-short">Service</span></button>
        <button role="tab" id="tab-forecast" aria-controls="view-forecast" data-view-tab="forecast" data-icon="desk" aria-selected="false"><span class="tab-long">Forecast</span><span class="tab-short">Forecast</span></button>
        <button role="tab" id="tab-plans" aria-controls="view-plans" data-view-tab="plans" data-icon="plans" aria-selected="false"><span class="tab-long">Plans</span><span class="tab-short">Plans</span></button>
        <button role="tab" id="tab-events" aria-controls="view-events" data-view-tab="events" data-icon="bolt" aria-selected="false"><span class="tab-long">Rare events</span><span class="tab-short">Events</span></button>
        <button role="tab" id="tab-copilot" aria-controls="view-copilot" data-view-tab="copilot" data-icon="copilot" aria-selected="false"><span class="tab-long">Copilot</span><span class="tab-short">Copilot</span></button>
        <button role="tab" id="tab-offers" aria-controls="view-donate" data-view-tab="donate" data-icon="leaf" aria-selected="false" class="ngo-only"><span class="tab-long">Food offers</span><span class="tab-short">Offers</span></button>
        <div class="more" id="more">
          <button type="button" class="more-btn" id="more-btn" aria-haspopup="true" aria-expanded="false" aria-controls="more-menu" data-icon="grid"><span class="more-label" id="more-label">More</span><svg class="ic more-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
          <div class="more-menu glass" id="more-menu" role="menu" hidden>
            <button type="button" role="menuitem" data-view-tab="calendar" data-icon="calendar"><span>Calendar<small>Holidays, exams and plan status</small></span></button>
            <button type="button" role="menuitem" data-view-tab="admin" data-icon="log"><span>Daily log<small>What really happened, automation</small></span></button>
            <button type="button" role="menuitem" data-view-tab="donate" data-icon="leaf"><span>Donations<small>Surplus food for NGOs</small></span></button>
            <button type="button" role="menuitem" data-view-tab="docs" data-icon="book"><span>Documents<small>SOPs the copilot follows</small></span></button>
          </div>
        </div>
      </div>
    </nav>
    <a class="topbar-link topbar-account" href="#account" id="topbar-account" data-icon="person"><span id="topbar-account-t">Sign in</span></a>
  </header>

  <div id="banner" class="banner" role="alert" hidden></div>
  <main id="main">
    <div id="view-landing" class="view" role="tabpanel" aria-labelledby="tab-landing" data-view-panel="landing"></div>
    <div id="view-service" class="view" role="tabpanel" aria-labelledby="tab-service" data-view-panel="service" hidden></div>
    <div id="view-forecast" class="view" role="tabpanel" aria-labelledby="tab-forecast" data-view-panel="forecast" hidden></div>
    <div id="view-plans" class="view" role="tabpanel" aria-labelledby="tab-plans" data-view-panel="plans" hidden></div>
    <div id="view-events" class="view" role="tabpanel" aria-labelledby="tab-events" data-view-panel="events" hidden></div>
    <div id="view-copilot" class="view" role="tabpanel" aria-labelledby="tab-copilot" data-view-panel="copilot" hidden></div>
    <div id="view-calendar" class="view" role="tabpanel" aria-label="Calendar" data-view-panel="calendar" hidden></div>
    <div id="view-admin" class="view" role="tabpanel" aria-label="Daily log" data-view-panel="admin" hidden></div>
    <div id="view-donate" class="view" role="tabpanel" aria-label="Donations" data-view-panel="donate" hidden></div>
    <div id="view-docs" class="view" role="tabpanel" aria-label="Documents" data-view-panel="docs" hidden></div>
    <div id="view-account" class="view" role="region" aria-label="Account" data-view-panel="account" hidden></div>
  </main>
  <div id="toasts" class="toasts" aria-hidden="true"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
